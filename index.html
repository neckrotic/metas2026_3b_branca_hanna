<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section class="conteudo-principal">
    <h2 class="titulo-principal">Objetivo do meu ano 2026<span>_</span></h2>

    <div class="botoes">
      <button class="botao botao-ativo">Fazer FUVEST</button>
      <button class="botao">Terminar Ensino Médio</button>
      <button class="botao">Formar</button>
      <button class="botao">Mudar para São Paulo</button>
    </div>

    <div class="abas-texto">

      <div class="aba-conteudo aba-conteudo-ativo">
        <h3 class="aba-conteudo-titulo-principal">Fazer FUVEST</h3>
        <h4 class="aba-conteudo-titulo-secundario">Tempo para completar objetivo</h4>

        <div class="contador">
          <div class="contador-digito">
            <p class="contador-digito-numero" id="dias0">7</p>
            <p class="contador-digito-texto">dias</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="horas0">7</p>
            <p class="contador-digito-texto">horas</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="min0">7</p>
            <p class="contador-digito-texto">min</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="seg0">7</p>
            <p class="contador-digito-texto">seg</p>
          </div>
        </div>
      </div>

      <div class="aba-conteudo">
        <h3 class="aba-conteudo-titulo-principal">Terminar Ensino Médio</h3>

        <div class="contador">
          <div class="contador-digito">
            <p class="contador-digito-numero" id="dias1">7</p>
            <p class="contador-digito-texto">dias</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="horas1">7</p>
            <p class="contador-digito-texto">horas</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="min1">7</p>
            <p class="contador-digito-texto">min</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="seg1">7</p>
            <p class="contador-digito-texto">seg</p>
          </div>
        </div>
      </div>

      <div class="aba-conteudo">
        <h3 class="aba-conteudo-titulo-principal">Realizar Formatura</h3>

        <div class="contador">
          <div class="contador-digito">
            <p class="contador-digito-numero" id="dias2">7</p>
            <p class="contador-digito-texto">dias</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="horas2">7</p>
            <p class="contador-digito-texto">horas</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="min2">7</p>
            <p class="contador-digito-texto">min</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="seg2">7</p>
            <p class="contador-digito-texto">seg</p>
          </div>
        </div>
      </div>

      <div class="aba-conteudo">
        <h3 class="aba-conteudo-titulo-principal">Mudar para São Paulo</h3>

        <div class="contador">
          <div class="contador-digito">
            <p class="contador-digito-numero" id="dias3">7</p>
            <p class="contador-digito-texto">dias</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="horas3">7</p>
            <p class="contador-digito-texto">horas</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="min3">7</p>
            <p class="contador-digito-texto">min</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="seg3">7</p>
            <p class="contador-digito-texto">seg</p>
          </div>
        </div>
      </div>

    </div>
  </section>
</body>
</html>
